server {
    listen 8080;
    client_max_body_size 5m;
    # Containers can receive a new IP after Compose recreates a backend.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    location /api/customer/ {
        set $service_customer customer:8080;
        proxy_pass http://$service_customer$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-GK-Portal $http_x_gk_portal;
        proxy_read_timeout 30s;
    }
    location /api/auth/ {
        set $service_auth auth:8080;
        proxy_pass http://$service_auth$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-GK-Portal $http_x_gk_portal;
        proxy_read_timeout 30s;
    }
    location /api/ {
        set $service_logistics logistics:8080;
        proxy_pass http://$service_logistics$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-GK-Portal $http_x_gk_portal;
        proxy_read_timeout 900s;
    }
    location / { return 404; }
}
