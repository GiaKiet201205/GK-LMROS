# GK: chạy toàn bộ hệ thống bằng `docker compose up --build`
# Web điều phối: http://localhost:3000      App tài xế: http://localhost:3001
name: gk
services:
  db:
    image: timescale/timescaledb-ha:pg16          # PostgreSQL 16 + PostGIS + TimescaleDB
    environment:
      POSTGRES_DB: ${DB_NAME:-gk}
      POSTGRES_USER: ${DB_USER:-gk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gk}
      TZ: Asia/Ho_Chi_Minh
    ports: ["127.0.0.1:${DB_PORT:-15433}:5432"]
    volumes:
      - dbdata:/home/postgres/pgdata/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gk} -d ${DB_NAME:-gk}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:                                            # Redpanda: tương thích Kafka, nhẹ hơn khi chạy trên laptop
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://localhost:9092
    ports: ["9092:9092"]

  optimizer:
    build: ./services/optimizer
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      OPTIMIZER_FIXED_TRIP_COST: ${OPTIMIZER_FIXED_TRIP_COST:-35000}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-estimate}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_MATRIX_MAX_POINTS: ${GOOGLE_MATRIX_MAX_POINTS:-100}
    expose: ["8000"]

  # Logistics owns the existing operational database and keeps its persistent volume.
  logistics:
    build: ./services/logistics
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gk}
      DB_USER: ${DB_USER:-gk}
      DB_PASSWORD: ${DB_PASSWORD:-gk}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      OPTIMIZER_URL: http://optimizer:8000
      AUTH_URL: http://auth:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GK_ASSISTANT_ENABLED: ${GK_ASSISTANT_ENABLED:-false}
      GK_ASSISTANT_PROVIDER: ${GK_ASSISTANT_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GK_ASSISTANT_MODEL: ${GK_ASSISTANT_MODEL:-gpt-4.1-mini}
      ROUTING_ENABLED: ${ROUTING_ENABLED:-true}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-gk_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-gk_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-gk_auth}
      TZ: Asia/Ho_Chi_Minh
    volumes: ["authdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-gk_auth} -d ${AUTH_DB_NAME:-gk_auth}"]
      interval: 5s
      retries: 20

  auth:
    build: ./services/auth
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME:-gk_auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-gk_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-gk_auth}
      LOGISTICS_URL: http://logistics:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a non-empty ADMIN_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      auth-db: { condition: service_healthy }
      logistics: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  gateway:
    image: nginx:1.27-alpine
    volumes: ["./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:8080"]
    depends_on:
      logistics: { condition: service_healthy }
      auth: { condition: service_healthy }
      customer: { condition: service_healthy }

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-gk_customer}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-gk_customer}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-gk_customer}
      TZ: Asia/Ho_Chi_Minh
    volumes: ["customerdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER:-gk_customer} -d ${CUSTOMER_DB_NAME:-gk_customer}"]
      interval: 5s
      retries: 20

  customer:
    build: ./services/customer
    environment:
      CUSTOMER_GOOGLE_CLIENT_ID: ${CUSTOMER_GOOGLE_CLIENT_ID:-}
      CUSTOMER_DB_URL: jdbc:postgresql://customer-db:5432/${CUSTOMER_DB_NAME:-gk_customer}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER:-gk_customer}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-gk_customer}
      LOGISTICS_URL: http://logistics:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      customer-db: { condition: service_healthy }
      logistics: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./apps/web
      args:
        PORTAL: dispatcher
    depends_on: [gateway]
    ports: ["3000:80"]

  driver-frontend:
    build:
      context: ./apps/web
      args:
        PORTAL: driver
    depends_on: [gateway]
    ports: ["3001:80"]

  customer-frontend:
    build:
      context: ./apps/web
      args:
        PORTAL: customer
    depends_on: [gateway]
    ports: ["3002:80"]

  # Database UI: docker compose --profile tools up --build -d prisma-studio prisma-studio-auth
  prisma-studio:
    profiles: ["tools"]
    build: ./tools/prisma-studio
    environment:
      STUDIO_DB_HOST: db
      STUDIO_DB_NAME: ${DB_NAME:-gk}
      STUDIO_DB_USER: ${DB_USER:-gk}
      STUDIO_DB_PASSWORD: ${DB_PASSWORD:-gk}
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      db: { condition: service_healthy }

  prisma-studio-auth:
    profiles: ["tools"]
    build: ./tools/prisma-studio
    environment:
      STUDIO_PUBLIC_PORT: "5556"
      STUDIO_DB_HOST: auth-db
      STUDIO_DB_NAME: ${AUTH_DB_NAME:-gk_auth}
      STUDIO_DB_USER: ${AUTH_DB_USER:-gk_auth}
      STUDIO_DB_PASSWORD: ${AUTH_DB_PASSWORD:-gk_auth}
    ports: ["127.0.0.1:5556:5555"]
    depends_on:
      auth-db: { condition: service_healthy }

  prisma-studio-customer:
    profiles: ["tools"]
    build: ./tools/prisma-studio
    environment:
      STUDIO_PUBLIC_PORT: "5557"
      STUDIO_DB_HOST: customer-db
      STUDIO_DB_NAME: ${CUSTOMER_DB_NAME:-gk_customer}
      STUDIO_DB_USER: ${CUSTOMER_DB_USER:-gk_customer}
      STUDIO_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-gk_customer}
    ports: ["127.0.0.1:5557:5555"]
    depends_on:
      customer-db: { condition: service_healthy }


volumes:
  dbdata:
    name: ${DB_VOLUME_NAME:-gk_dbdata}
  authdata:
    name: ${AUTH_DB_VOLUME_NAME:-gk_authdata}
  customerdata:
    name: ${CUSTOMER_DB_VOLUME_NAME:-gk_customerdata}
