server:
  port: ${SERVER_PORT:8080}
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: gk-logistics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:15433}/gk}
    username: ${DB_USER:gk}
    password: ${DB_PASSWORD:gk}
    hikari:
      connection-init-sql: "SET TIME ZONE 'Asia/Ho_Chi_Minh'"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 2000
app:
  auth-url: ${AUTH_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  optimizer-url: ${OPTIMIZER_URL:http://localhost:8000}
  depart-minute: ${DEPART_MINUTE:480}   # giờ xuất phát giả định của chuyến mới (phút từ 00:00)
